<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Marquedown</title>
        <link rel="stylesheet" href="css/editormd.css" />
        <link rel="stylesheet" href="css/heroui.css" />
        <link rel="stylesheet" href="css/icons.css" />
        <link rel="icon" href="assets/icon.png" />
        <script>
            (function () {
                var stored = null;

                try {
                    stored = localStorage.getItem("editormd-theme");
                } catch (e) {}

                var mq = window.matchMedia("(prefers-color-scheme: dark)");

                document.documentElement.setAttribute(
                    "data-theme",
                    stored || (mq.matches ? "dark" : "light")
                );

                window.__themeFollowsSystem = !stored;

                mq.addEventListener("change", function (e) {
                    if (window.__themeFollowsSystem) {
                        document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
                    }
                });
            })();
        </script>
    </head>
    <body>
        <div id="test-editormd">
            <textarea style="display:none;">

# Welcome to Marquedown

A lightweight Markdown editor with live preview & syntax highlighting.

## Highlights

- Live HTML preview with synchronized scrolling
- GitHub-flavored Markdown, tables and task lists
- Code folding, search &amp; replace and dialogs
- Preview light and dark themes live

## Task list

- [x] Task 1
- [x] Task 2
- [ ] Task 3

## Table

| Feature      | Shortcut            |
| :----------- | :------------------ |
| Bold         | Ctrl / Cmd + B      |
| Italic       | Ctrl / Cmd + I      |
| Link         | Ctrl / Cmd + L      |

## Code

```js
const editor = marquedown("test-marquedown", {
    path: "lib/",
    theme: "default",
    previewTheme: "default"
});
```

> Tip: Use the **toolbar** to access all features.

---

</textarea>
        </div>

        <button
            type="button"
            class="hui-theme-toggle"
            id="theme-toggle"
            title="Toggle dark / light theme"
            aria-label="Toggle dark / light theme"
        >
            <i class="hui-icon hui-icon--moon" aria-hidden="true"></i>
        </button>

        <script src="lib/jquery.min.js"></script>
        <script src="lib/editormd.min.js"></script>
        <script type="text/javascript">
            $(function () {
                var electron = window.electronAPI || null;
                var currentFilename = "untitled.md";
                var fileHandle = null;
                var currentPath = null;
                var savedMarkdown = "";
                var $fileInput = null;
                var toolbarReady = false;
                var loadDocument = null;

                // The welcome example lives in the source textarea. Stash it and clear the
                // textarea before editor.md initializes so the example never flashes on screen;
                // it is only loaded when it is actually the document to show.
                var welcomeSource = $("#test-editormd textarea");
                var welcomeMarkdown = welcomeSource.length ? welcomeSource.val() : "";

                if (welcomeSource.length) welcomeSource.val("");

                (function () {
                    var createDialog = editormd.createDialog;

                    editormd.createDialog = function (options) {
                        var dialog = createDialog.call(this, options);
                        var recenter = function () {
                            $(window).trigger("resize");
                        };

                        setTimeout(recenter, 60);
                        setTimeout(recenter, 250);
                        setTimeout(recenter, 600);

                        return dialog;
                    };

                    $(document).on("click", ".editormd-mask", function () {
                        var close = $(".editormd-dialog:visible").last().find(".editormd-dialog-close")[0];

                        if (close) close.click();
                    });
                })();

                function toolbarAnchor(name) {
                    var icon = document.querySelector('.editormd-menu i[name="' + name + '"]');

                    return icon ? icon.parentNode : null;
                }

                function customizeToolbar(editor) {
                    addFileButtons(editor);
                    groupToolbar();
                    buildMenubar(editor);
                }

                var baseSetToolbar = editormd.fn.setToolbar;

                editormd.fn.setToolbar = function () {
                    var result = baseSetToolbar.apply(this, arguments);

                    if (toolbarReady) {
                        customizeToolbar(this);
                    }

                    return result;
                };

                var testEditor = editormd("test-editormd", {
                    width: "100%",
                    height: window.innerHeight,
                    path: "lib/",
                    theme: "default",
                    previewTheme: "default",
                    editorTheme: "default",
                    syncScrolling: "single",
                    taskList: true,
                    toolbarIcons: [
                        "undo", "redo", "|",
                        "bold", "del", "italic", "quote", "ucwords", "uppercase", "lowercase", "|",
                        "h1", "h2", "h3", "h4", "h5", "h6", "|",
                        "list-ul", "list-ol", "hr", "|",
                        "link", "reference-link", "image", "code", "preformatted-text", "code-block", "|",
                        "table", "datetime", "html-entities", "pagebreak", "|",
                        "goto-line", "watch", "preview", "clear", "search"
                    ],
                    codeFold: true,
                    searchReplace: true,
                    htmlDecode: true,
                    flowChart: false,
                    sequenceDiagram: false,
                    placeholder: "Start writing…",
                    onload: function () {
                        var editor = this;

                        savedMarkdown = editor.getMarkdown();
                        updateCount(editor);
                        customizeToolbar(editor);
                        toolbarReady = true;

                        applyInitialDocument();

                        $(window).on("resize", function () {
                            editor.height(window.innerHeight);
                        });
                    },
                    onchange: function () {
                        updateCount(this);
                    }
                });

                function updateCount(editor) {
                    var isDirty = editor.getMarkdown() !== savedMarkdown;
                    var hasFile = !!(currentPath || fileHandle);

                    if (electron) electron.setDirty(isDirty);

                    document.title =
                        (isDirty ? "• " : "") + (hasFile ? currentFilename + " - " : "") + "Marquedown";
                }

                function applyInitialDocument() {
                    if (!electron || !electron.getInitialDocument || !loadDocument) {
                        if (loadDocument) loadDocument("untitled.md", welcomeMarkdown, null, null);
                        return;
                    }

                    electron
                        .getInitialDocument()
                        .then(function (doc) {
                            if (!doc || doc.source === "welcome") {
                                loadDocument("untitled.md", welcomeMarkdown, null, null);
                                return;
                            }

                            if (doc.source === "empty") {
                                loadDocument("untitled.md", "", null, null);
                                return;
                            }

                            loadDocument(doc.name, doc.content, null, doc.path);
                        })
                        .catch(function (err) {
                            console.error(err);
                        })
                        .then(function () {
                            if (electron.rendered) electron.rendered();
                        });
                }

                function addFileButtons(editor) {
                    var $menu = $(".editormd-menu");
                    if (!$menu.length || $menu.find('i[name="open"]').length) return;

                    var newBtn =
                        '<li class="hui-tb-file"><a href="javascript:;" title="New document (Ctrl/Cmd + N)">' +
                        '<i class="fa" name="new"></i></a></li>';
                    var openBtn =
                        '<li class="hui-tb-file"><a href="javascript:;" title="Open a Markdown file">' +
                        '<i class="fa" name="open"></i></a></li>';
                    var saveBtn =
                        '<li class="hui-tb-file"><a href="javascript:;" title="Save (Ctrl/Cmd + S)">' +
                        '<i class="fa" name="save"></i></a></li>';
                    var divider = '<li class="divider" unselectable="on">|</li>';

                    $menu.prepend(divider).prepend(saveBtn).prepend(openBtn).prepend(newBtn);

                    var pickerTypes = [
                        {
                            description: "Markdown",
                            accept: { "text/markdown": [".md", ".markdown", ".mdown"] },
                        },
                        { description: "Text", accept: { "text/plain": [".txt"] } },
                    ];

                    if (!$fileInput) {
                        $fileInput = $(
                            '<input type="file" accept=".md,.markdown,.mdown,.txt,text/markdown" style="display:none">'
                        ).appendTo("body");
                    }

                    var $input = $fileInput;

                    function fail(err) {
                        console.error(err);
                        if (electron) electron.showError(String((err && err.message) || err));
                    }

                    function rememberDocument() {
                        if (!electron || !electron.setLastDocument) return;

                        electron.setLastDocument({ path: currentPath, name: currentFilename });
                    }

                    function load(name, text, handle, elecPath) {
                        editor.setMarkdown(text);
                        currentFilename = name || "untitled.md";
                        fileHandle = handle || null;
                        currentPath = elecPath || null;
                        savedMarkdown = editor.getMarkdown();
                        rememberDocument();
                        updateCount(editor);
                    }

                    function afterSave(text) {
                        savedMarkdown = text;
                        rememberDocument();
                        updateCount(editor);
                    }

                    loadDocument = load;

                    function newDocument() {
                        if (editor.getMarkdown() !== savedMarkdown) {
                            var discard = window.confirm(
                                "Discard unsaved changes and start a new document?"
                            );

                            if (!discard) return false;
                        }

                        load("untitled.md", "", null, null);
                        editor.focus();
                        return true;
                    }

                    function writeHandle(handle, text) {
                        return handle.createWritable().then(function (writable) {
                            return writable.write(text).then(function () {
                                return writable.close();
                            });
                        });
                    }

                    function download(text) {
                        var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
                        var url = URL.createObjectURL(blob);
                        var link = document.createElement("a");

                        link.href = url;
                        link.download = currentFilename;
                        document.body.appendChild(link);
                        link.click();
                        link.remove();
                        URL.revokeObjectURL(url);

                        afterSave(text);
                    }

                    function save(forceDialog) {
                        var text = editor.getMarkdown();

                        if (electron) {
                            if (currentPath && !forceDialog) {
                                if (text === savedMarkdown) {
                                    electron.saveCanceled();
                                    return;
                                }

                                electron
                                    .writeFile(currentPath, text)
                                    .then(function () {
                                        afterSave(text);
                                        electron.saveDone();
                                    })
                                    .catch(function (err) {
                                        fail(err);
                                        electron.saveCanceled();
                                    });
                                return;
                            }

                            electron
                                .saveFileAs(currentFilename, text)
                                .then(function (res) {
                                    if (!res) {
                                        electron.saveCanceled();
                                        return;
                                    }

                                    currentPath = res.path;
                                    fileHandle = null;
                                    currentFilename = res.name;
                                    afterSave(text);
                                    electron.saveDone();
                                })
                                .catch(function (err) {
                                    fail(err);
                                    electron.saveCanceled();
                                });
                            return;
                        }

                        if (fileHandle && !forceDialog) {
                            if (text === savedMarkdown) {
                                return;
                            }

                            writeHandle(fileHandle, text)
                                .then(function () {
                                    afterSave(text);
                                })
                                .catch(fail);
                            return;
                        }

                        if (!window.showSaveFilePicker) {
                            download(text);
                            return;
                        }

                        window
                            .showSaveFilePicker({ suggestedName: currentFilename, types: pickerTypes })
                            .then(function (handle) {
                                fileHandle = handle;
                                currentPath = null;
                                currentFilename = handle.name || currentFilename;
                                return writeHandle(handle, text);
                            })
                            .then(function () {
                                afterSave(text);
                            })
                            .catch(function (err) {
                                if (err && err.name === "AbortError") return;
                                fail(err);
                            });
                    }

                    function open() {
                        if (electron) {
                            electron
                                .openFile()
                                .then(function (res) {
                                    if (res) load(res.name, res.content, null, res.path);
                                })
                                .catch(function (err) {
                                    console.error(err);
                                });
                            return;
                        }

                        if (!window.showOpenFilePicker) {
                            $input.val("").trigger("click");
                            return;
                        }

                        window
                            .showOpenFilePicker({ multiple: false, types: pickerTypes })
                            .then(function (handles) {
                                var handle = handles[0];
                                return handle.getFile().then(function (file) {
                                    return file.text().then(function (text) {
                                        load(file.name, text, handle, null);
                                    });
                                });
                            })
                            .catch(function (err) {
                                if (err && err.name === "AbortError") return;
                                console.error(err);
                            });
                    }

                    $menu.find('i[name="new"]').parent().on("click", function () {
                        newDocument();
                    });
                    $menu.find('i[name="open"]').parent().on("click", open);
                    $menu.find('i[name="save"]').parent().on("click", function () {
                        save(false);
                    });

                    $input.off("change").on("change", function () {
                        var file = this.files && this.files[0];
                        if (!file) return;

                        var reader = new FileReader();

                        reader.onload = function (e) {
                            load(file.name, e.target.result, null, null);
                        };

                        reader.readAsText(file);
                    });

                    if (electron) {
                        if (electron.onOpenFile) {
                            electron.onOpenFile(function (doc) {
                                if (doc && typeof doc.content === "string") {
                                    load(doc.name, doc.content, null, doc.path);
                                }
                            });
                        }

                        electron.onMenu(function (action) {
                            if (action === "new") newDocument();
                            else if (action === "open") open();
                            else if (action === "save") save(false);
                            else if (action === "saveAs") save(true);
                            else if (action === "toggleTheme") toggleTheme();
                        });
                    } else {
                        $(document).on("keydown", function (e) {
                            if (
                                (e.ctrlKey || e.metaKey) &&
                                !e.shiftKey &&
                                !e.altKey &&
                                (e.key === "s" || e.key === "S")
                            ) {
                                e.preventDefault();
                                save(false);
                            }
                        });
                    }
                }

                function splitTitle(title) {
                    var m = title.match(/^(.*?)\s*\(([^)]*)\)\s*$/);

                    if (
                        m &&
                        /^(ctrl|cmd|command|shift|alt|option|f\d)/i.test(m[2].trim()) &&
                        m[2].trim().length <= 24
                    ) {
                        return { label: m[1].trim(), hint: m[2].trim() };
                    }

                    return { label: title, hint: "" };
                }

                function closeMenus() {
                    $(".hui-menubar__group").removeClass("is-open");
                }

                function buildMenubar(editor) {
                    var $menu = $(".editormd-menu");

                    if (!$menu.length) return;

                    if ($(".hui-menubar").length) {
                        syncMenubar();
                        return;
                    }

                    var categories = {
                        new: "File",
                        open: "File",
                        save: "File",
                        undo: "Edit",
                        redo: "Edit",
                        bold: "Format",
                        del: "Format",
                        italic: "Format",
                        quote: "Format",
                        ucwords: "Format",
                        uppercase: "Format",
                        lowercase: "Format",
                        h1: "Headings",
                        h2: "Headings",
                        h3: "Headings",
                        h4: "Headings",
                        h5: "Headings",
                        h6: "Headings",
                        "list-ul": "Lists",
                        "list-ol": "Lists",
                        hr: "Lists",
                        link: "Insert",
                        "reference-link": "Insert",
                        image: "Insert",
                        code: "Insert",
                        "preformatted-text": "Insert",
                        "code-block": "Insert",
                        table: "Insert",
                        datetime: "Insert",
                        "html-entities": "Insert",
                        pagebreak: "Insert",
                        "goto-line": "Extras",
                        watch: "Extras",
                        preview: "Extras",
                        clear: "Extras",
                        search: "Extras"
                    };

                    var order = [];
                    var buckets = {};

                    $menu.children("li").each(function () {
                        var $a = $(this).children("a");
                        var name = $a.find("i").attr("name");
                        var category = categories[name];

                        if (!category) return;

                        if (!buckets[category]) {
                            buckets[category] = [];
                            order.push(category);
                        }

                        buckets[category].push($a);
                    });

                    var $bar = $('<div class="hui-menubar"></div>');

                    $.each(order, function (_, title) {
                        var $group = $('<div class="hui-menubar__group"></div>');
                        var $btn = $('<button type="button" class="hui-menubar__btn"></button>').text(title);
                        var $pop = $('<div class="hui-menubar__pop"></div>');

                        $.each(buckets[title], function (_, $a) {
                            var name = $a.find("i").attr("name");
                            var $item = $('<a class="hui-menubar__item" href="javascript:;"></a>');

                            $item.append($('<i class="hui-i"></i>').attr("name", name));
                            $item.append($('<span class="hui-menubar__label"></span>'));

                            $item.on("click", function () {
                                closeMenus();

                                var anchor = toolbarAnchor(name);

                                if (anchor) anchor.click();

                                syncMenubar();
                            });

                            $pop.append($item);
                        });

                        $btn.on("click", function (e) {
                            e.stopPropagation();

                            var isOpen = $group.hasClass("is-open");
                            closeMenus();

                            if (!isOpen) {
                                syncMenubar();
                                $group.addClass("is-open");
                            }
                        });

                        $group.on("mouseenter", function () {
                            if ($(".hui-menubar__group.is-open").length && !$group.hasClass("is-open")) {
                                closeMenus();
                                syncMenubar();
                                $group.addClass("is-open");
                            }
                        });

                        $group.append($btn).append($pop);
                        $bar.append($group);
                    });

                    $(".editormd-toolbar").prepend($bar);

                    syncMenubar();

                    editor.height(window.innerHeight);
                }

                function menuLabel(name, title) {
                    if (name === "new") return { label: "New", hint: "" };
                    if (name === "open") return { label: "Open", hint: "" };

                    return splitTitle(title);
                }

                function syncMenubar() {
                    $(".hui-menubar__item").each(function () {
                        var $item = $(this);
                        var $icon = $item.find(".hui-i");
                        var name = $icon.attr("name");
                        var anchor = toolbarAnchor(name);

                        if (!anchor) return;

                        var $a = $(anchor);
                        var parts = menuLabel(name, $a.attr("title") || name || "");

                        $item.find(".hui-menubar__label").text(parts.label);

                        var $hint = $item.find(".hui-menubar__hint");

                        if (parts.hint) {
                            if (!$hint.length) {
                                $hint = $('<span class="hui-menubar__hint"></span>').appendTo($item);
                            }
                            $hint.text(parts.hint);
                        } else if ($hint.length) {
                            $hint.remove();
                        }

                        var state = ($a.find("i").attr("class") || "")
                            .split(/\s+/)
                            .filter(function (c) {
                                return c === "fa-eye" || c === "fa-eye-slash";
                            });

                        $icon.attr("class", ["hui-i"].concat(state).join(" "));
                    });
                }

                $(document).on("click", closeMenus);
                $(document).on("keydown", function (e) {
                    if (e.key === "Escape") closeMenus();
                });

                function groupToolbar() {
                    var groups = [[]];

                    $(".editormd-menu")
                        .children("li")
                        .each(function () {
                            if ($(this).hasClass("divider")) {
                                groups.push([]);
                            } else {
                                groups[groups.length - 1].push(this);
                            }
                        });

                    $.each(groups, function (_, items) {
                        $.each(items, function (i, el) {
                            var $el = $(el).addClass("hui-tb-group-item");
                            if (i === 0) $el.addClass("hui-tb-group-start");
                            if (i === items.length - 1) $el.addClass("hui-tb-group-end");
                        });
                    });
                }

                var themeToggle = $("#theme-toggle");

                function renderToggle(theme) {
                    themeToggle
                        .find("i")
                        .removeClass("hui-icon--moon hui-icon--sun")
                        .addClass(theme === "dark" ? "hui-icon--sun" : "hui-icon--moon");
                }

                function setTheme(theme) {
                    document.documentElement.setAttribute("data-theme", theme);
                    window.__themeFollowsSystem = false;

                    try {
                        localStorage.setItem("editormd-theme", theme);
                    } catch (e) {}

                    renderToggle(theme);
                }

                function toggleTheme() {
                    var current = document.documentElement.getAttribute("data-theme") || "light";
                    setTheme(current === "dark" ? "light" : "dark");
                }

                renderToggle(document.documentElement.getAttribute("data-theme") || "light");
                themeToggle.on("click", toggleTheme);

                $(document).on("keydown", function (e) {
                    if ((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey && (e.key === "d" || e.key === "D")) {
                        e.preventDefault();
                        toggleTheme();
                    }
                });
            });
        </script>
    </body>
</html>
